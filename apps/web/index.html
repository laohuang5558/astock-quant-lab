<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="metric-fingerprint" content="e819989972c994d1">
<title>A股量化研究平台 · 运行控制台</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --surface-2:#fbfcfd; --line:#e3e7ec;
    --ink:#1b2430; --ink-2:#4a5768; --ink-3:#8492a3;
    --up:#c62828; --up-bg:#fdecec; --down:#1b7a4b; --down-bg:#e8f5ee;
    --accent:#1f4e79; --accent-bg:#eaf1f8; --warn:#b26a00; --warn-bg:#fff4e0;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       font-size:14px;line-height:1.6}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
  header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
       background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{width:34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;
       display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:-1px}
  h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}
  .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .badge{font-size:11.5px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);
       background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
  .badge.online{background:var(--down-bg);border-color:#bfe3cf;color:var(--down)}
  .badge.offline{background:var(--warn-bg);border-color:#f0d9ac;color:var(--warn)}
  .badge.mono{font-family:var(--mono);font-size:11px}
  .alert{border-radius:10px;padding:13px 18px;margin-bottom:16px;border:1px solid #f0c9c9;
       background:var(--up-bg);color:#8e2020;font-size:13.5px;display:flex;gap:12px;align-items:flex-start}
  .alert b{font-size:14px}
  .alert .pill{background:var(--up);color:#fff;border-radius:5px;padding:2px 9px;font-size:11.5px;
       font-weight:600;white-space:nowrap;margin-top:2px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tab{border:0;background:transparent;padding:9px 15px;font-size:13.5px;color:var(--ink-2);
       cursor:pointer;border-bottom:2px solid transparent;font-family:inherit}
  .tab:hover{color:var(--accent)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .panel{display:none}.panel.active{display:block}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 4px;font-weight:650}
  .card .desc{font-size:12px;color:var(--ink-3);margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px}
  .kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .kpi .k{font-size:11.5px;color:var(--ink-3);margin-bottom:5px}
  .kpi .v{font-size:20px;font-weight:650;font-family:var(--mono);letter-spacing:-.5px}
  .kpi .n{font-size:11px;color:var(--ink-3);margin-top:3px}
  .v.up{color:var(--up)} .v.down{color:var(--down)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11.5px;color:var(--ink-3);font-weight:600;background:var(--surface-2);
     position:sticky;top:0;z-index:1}
  tr:last-child td{border-bottom:0}
  td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
  .tw{overflow:auto;max-height:460px;border:1px solid var(--line);border-radius:8px}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;white-space:nowrap}
  .tag.ok{background:var(--down-bg);color:var(--down)}
  .tag.no{background:var(--up-bg);color:var(--up)}
  .tag.mid{background:var(--warn-bg);color:var(--warn)}
  .tag.info{background:var(--accent-bg);color:var(--accent)}
  .chart{width:100%;height:auto;display:block}
  .legend{display:flex;gap:16px;font-size:11.5px;color:var(--ink-3);margin-top:8px;flex-wrap:wrap}
  .legend i{display:inline-block;width:11px;height:3px;vertical-align:middle;margin-right:5px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button.act{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;
       padding:8px 15px;font-size:12.5px;cursor:pointer;font-family:inherit}
  button.act:hover{opacity:.88}
  button.act[disabled]{opacity:.45;cursor:not-allowed}
  button.ghost{background:var(--surface);color:var(--accent);border-color:var(--line)}
  .hint{font-size:11.5px;color:var(--ink-3)}
  pre.log{background:#111a24;color:#d7e2ee;border-radius:8px;padding:13px 15px;font-family:var(--mono);
       font-size:11.5px;line-height:1.55;max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-all}
  ul.clean{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}
  ul.clean li{margin-bottom:5px}
  a{color:var(--accent)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:860px){.split{grid-template-columns:1fr}}
  footer{margin-top:22px;padding:16px 20px;background:var(--surface);border:1px solid var(--line);
       border-radius:10px;font-size:12px;color:var(--ink-3)}
  .loading{padding:26px;text-align:center;color:var(--ink-3);font-size:13px}
  .err{color:var(--up);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">QL</div>
      <div>
        <h1>A股量化研究平台 · 运行控制台</h1>
        <div class="sub">research-only · 中低频多因子＋趋势 · 数据来自真实产物，不提供投资建议</div>
      </div>
    </div>
    <div class="badges" id="badges"><span class="badge">正在连接数据服务…</span></div>
  </header>

  <div id="verdict" class="alert" style="display:none"></div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-p="overview">总览</button>
    <button class="tab" data-p="equity">净值与回撤</button>
    <button class="tab" data-p="factors">因子检验</button>
    <button class="tab" data-p="overfit">过拟合四件套</button>
    <button class="tab" data-p="gate">质量门</button>
    <button class="tab" data-p="risk">风险定级</button>
    <button class="tab" data-p="tasks">任务与接口</button>
    <button class="tab" data-p="delivery">交付物</button>
    <button class="tab" data-p="feikai">飞凯材料策略</button>
    <button class="tab" data-p="t8094">8094 改造评估</button>
  </nav>

  <section class="panel active" id="p-overview"><div class="loading">加载真实读数…</div></section>
  <section class="panel" id="p-equity"></section>
  <section class="panel" id="p-factors"></section>
  <section class="panel" id="p-overfit"></section>
  <section class="panel" id="p-gate"></section>
  <section class="panel" id="p-risk"></section>
  <section class="panel" id="p-tasks"></section>
  <section class="panel" id="p-delivery"></section>
  <section class="panel" id="p-feikai"></section>
  <section class="panel" id="p-t8094"></section>

  <footer id="footer"></footer>
</div>

<script src="snapshot.js"></script>
<script>
(function(){
  "use strict";
  var API = "/quant/api/v1";
  // 内网 Filer（8888）只做静态托管，无后端进程；直接走内联快照，避免无谓探测
  var STATIC_ONLY = (location.port === "8888");
  var S = window.__QUANT_SNAPSHOT__ || null;
  var STATE = { online:false, rep:null, equity:[], opinions:null, tasks:[], fingerprint:"pending" };
  var $ = function(id){ return document.getElementById(id); };

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function pct(x,d){ return x == null || isNaN(x) ? "—" : (x*100).toFixed(d==null?2:d)+"%"; }
  function num(x,d){ return x == null || isNaN(x) ? "—" : Number(x).toFixed(d==null?4:d); }
  function cls(x){ return x == null ? "" : (x>0 ? "up" : (x<0 ? "down" : "")); }
  function tag(v){
    var c = (v==="成立"||v==="通过"||v==="是"||v===true||v==="succeeded"||v==="ok") ? "ok"
          : (v==="不成立"||v==="否"||v===false||v==="failed"||v==="不放行") ? "no"
          : (v==="存疑"||v==="running"||v==="queued") ? "mid" : "info";
    return '<span class="tag '+c+'">'+esc(v)+"</span>";
  }
  function kpi(k,v,n,c){ return '<div class="kpi"><div class="k">'+esc(k)+'</div><div class="v '+(c||"")+'">'+v+"</div>"+(n?'<div class="n">'+esc(n)+"</div>":"")+"</div>"; }
  function card(title,desc,body){ return '<div class="card"><h2>'+esc(title)+'</h2>'+(desc?'<div class="desc">'+esc(desc)+"</div>":"")+body+"</div>"; }
  function table(cols,rows){
    var h = "<thead><tr>"+cols.map(function(c){ return "<th>"+esc(c)+"</th>"; }).join("")+"</tr></thead>";
    var b = "<tbody>"+rows.map(function(r){ return "<tr>"+r.map(function(x){ return "<td>"+x+"</td>"; }).join("")+"</tr>"; }).join("")+"</tbody>";
    return '<div class="tw"><table>'+h+b+"</table></div>";
  }
  function timeoutFetch(url,opt,ms){
    return new Promise(function(resolve,reject){
      var done=false;
      var timer=setTimeout(function(){ if(!done){done=true;reject(new Error("timeout"));} },ms||2500);
      fetch(url,opt||{}).then(function(r){ if(!done){done=true;clearTimeout(timer);resolve(r);} },
                              function(e){ if(!done){done=true;clearTimeout(timer);reject(e);} });
    });
  }
  function api(path,opt){
    return timeoutFetch(API+path,opt,8000).then(function(r){ return r.json(); });
  }

  // ---------- 数据装载：在线优先，失败回退到内联真实快照 ----------
  function loadOffline(){
    if(!S || !S.result) throw new Error("数据服务不可达且缺少内联快照");
    STATE.rep = S.result;
    STATE.equity = S.equity || [];
    STATE.opinions = S.opinions || {opinions:[],verdict:""};
    STATE.tasks = [];
    STATE.fingerprint = S.fingerprint || "pending";
  }

  function boot(){
    if(STATIC_ONLY){
      return Promise.resolve().then(function(){ STATE.online=false; loadOffline(); })
        .then(afterLoad).catch(function(e){
          $("p-overview").innerHTML='<div class="card"><div class="err">数据装载失败：'+esc(e.message)+"</div></div>";
        });
    }
    return timeoutFetch(API+"/health",{},1800).then(function(r){
      if(!r.ok) throw new Error("health not ok");
      STATE.online=true;
      return Promise.all([ api("/runs/v3-current/result"), api("/runs/v3-current/equity"),
                           api("/audit/v3-current/opinions"), api("/agents/tasks") ]);
    }).then(function(all){
      STATE.rep = all[0].data.result;
      STATE.equity = all[1].data.series || [];
      STATE.opinions = all[2].data;
      STATE.tasks = all[3].data.tasks || [];
      STATE.fingerprint = all[0].metric_fingerprint || STATE.fingerprint;
    }).catch(function(){
      STATE.online=false;
      loadOffline();
    }).then(afterLoad).catch(function(e){
      $("p-overview").innerHTML='<div class="card"><div class="err">数据装载失败：'+esc(e.message)+"</div></div>";
    });
  }

  function afterLoad(){
    var meta=document.querySelector('meta[name="metric-fingerprint"]');
    if(meta) meta.setAttribute("content",STATE.fingerprint);
    render();
  }

  function render(){
    var rep=STATE.rep, p=rep.performance||{}, q=rep.quality_gate||{};
    $("badges").innerHTML =
      '<span class="badge '+(STATE.online?"online":"offline")+'">'+(STATE.online?"● 在线服务":"● 离线只读快照")+"</span>"+
      '<span class="badge mono">指纹 '+esc(STATE.fingerprint)+"</span>"+
      '<span class="badge">'+esc(rep.meta && rep.meta.generated_at || "—")+"</span>"+
      '<span class="badge">'+esc(rep.meta && rep.meta.sample ? rep.meta.sample.codes+" 只 / "+rep.meta.sample.dates+" 日" : "")+"</span>";

    $("verdict").style.display="flex";
    $("verdict").innerHTML='<span class="pill">策略结论 '+esc(q.final_verdict||"—")+'</span>'+
      '<div><b>质量门裁决：工程 '+esc(q.engineering_gate||"—")+' / 策略 '+esc(q.strategy_conclusion_gate||"—")+'</b><br>'+
      esc(rep.one_line_conclusion||"")+'<br><span style="font-size:12px">硬否决项：'+esc((q.hard_fail_items||[]).join("、"))+"</span></div>";

    renderOverview(); renderEquity(); renderFactors(); renderOverfit();
    renderGate(); renderRisk(); renderTasks(); renderDelivery(); renderFeikai();
    renderT8094();  // 第 10 面板：8094 改造评估
    $("footer").innerHTML="<b>合规声明</b><br>"+(rep.compliance||[]).map(esc).join("<br>")+
      "<br>颜色约定："+esc(rep.color_convention||"红涨绿跌")+"；本系统为 research-only，不含实盘下单、券商接口与自动交易循环。";
  }

  function renderOverview(){
    var rep=STATE.rep,p=rep.performance||{},q=rep.quality_gate||{};
    var k = '<div class="grid">'+
      kpi("总收益",pct(p.total_return),null,cls(p.total_return))+
      kpi("年化收益",pct(p.annualized_return),null,cls(p.annualized_return))+
      kpi("夏普比率",num(p.sharpe),null,"")+
      kpi("最大回撤",pct(p.max_drawdown),null,cls(p.max_drawdown))+
      kpi("卡玛比率",num(p.calmar),null,"")+
      kpi("年化波动",pct(p.annualized_vol),null,"")+
      kpi("峰度",num(p.kurtosis,2),"尾部风险","")+
      kpi("月度胜率",pct(p.monthly_win_rate),null,"")+
      " </div>";
    var d = card("核心绩效","来源：output/result.json → performance，全部为本次真实运行读数",k);
    var s = rep.meta && rep.meta.sample || {};
    var d2 = card("样本与约束","",'<div class="grid">'+
      kpi("交易日期",esc(s.start||"—")+" ~ "+esc(s.end||"—"),esc(s.dates)+" 个交易日","")+
      kpi("样本标的",esc(s.codes)+" 只","演示样本，非全 A","")+
      kpi("入模 bar",esc(s.bars),"覆盖率 "+pct(s.coverage,2),"")+
      kpi("成交笔数",esc(p.n_trades),"被拒 "+esc(p.blocked_orders)+" 笔","")+
      kpi("总成本","¥"+Number(p.cost_total_cny||0).toLocaleString("zh-CN",{maximumFractionDigits:2}),"占毛收益 "+pct(p.cost_share_of_gross),"")+
      kpi("最低现金","¥"+Number(p.cash_min_cny||0).toLocaleString("zh-CN"),"≥0，纯多头无杠杆","")+
      kpi("最大敞口",num(p.max_position_exposure,4),"≤1.0","")+
      kpi("未成交挂单",esc(p.unfilled_orders),"已在下期目标重试","")+"</div>");
    var hard=(q.hard_fail_items||[]).map(function(x){return "<li>"+esc(x)+"</li>";}).join("");
    var counts=q.counts||{};
    var d3=card("质量门摘要","唯一放行出口：report.py::quality_gate()",
      '<div class="row" style="margin-bottom:10px">'+tag(q.final_verdict)+
      "<span class=\"hint\">成立 "+esc(counts["成立"]||0)+" / 不成立 "+esc(counts["不成立"]||0)+" / 存疑 "+esc(counts["存疑"]||0)+"</span></div>"+
      "<b style=\"font-size:12.5px\">4 条硬否决：</b><ul class=\"clean\">"+hard+"</ul>");
    $("p-overview").innerHTML=d+d2+d3;
  }

  function renderEquity(){
    var s=STATE.equity||[];
    if(!s.length){ $("p-equity").innerHTML=card("净值曲线","","<div class=err>无净值序列</div>"); return; }
    var W=1100,H=300,PAD=42;
    var vals=s.map(function(x){return x.equity;});
    var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
    var span=(hi-lo)||1, pad=span*0.08; lo-=pad; hi+=pad;
    var xs=function(i){ return PAD+i*(W-2*PAD)/(s.length-1); };
    var ys=function(v){ return H-PAD-(v-lo)/(hi-lo)*(H-2*PAD); };
    var line=s.map(function(x,i){return (i?"L":"M")+xs(i).toFixed(1)+","+ys(x.equity).toFixed(1);}).join(" ");
    var base=ys(s[0].equity);
    var peak=s[0].equity, dd=[];
    s.forEach(function(x){ peak=Math.max(peak,x.equity); dd.push(x.equity/peak-1); });
    var dmin=Math.min.apply(null,dd)||-1;
    var dl=dd.map(function(v,i){return (i?"L":"M")+xs(i).toFixed(1)+","+(H-PAD-(v/dmin)*(H-2*PAD)*0.9).toFixed(1);}).join(" ");
    var grid="";
    for(var g=0;g<=4;g++){
      var gy=PAD+g*(H-2*PAD)/4, label=hi-(hi-lo)*g/4;
      grid+='<line x1="'+PAD+'" y1="'+gy+'" x2="'+(W-PAD)+'" y2="'+gy+'" stroke="#e3e7ec" stroke-width="1"/>'+
           '<text x="6" y="'+(gy+4)+'" font-size="10" fill="#8492a3">'+(label/10000).toFixed(0)+"万</text>";
    }
    var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="净值曲线">'+
      grid+'<path d="'+line+'" fill="none" stroke="#c62828" stroke-width="1.8"/>'+
      '<line x1="'+PAD+'" y1="'+base+'" x2="'+(W-PAD)+'" y2="'+base+'" stroke="#8492a3" stroke-dasharray="4 4" stroke-width="1"/>'+
      '<text x="'+(PAD+6)+'" y="'+(PAD+2)+'" font-size="11" fill="#4a5768">'+esc(s[0].date)+" 起 · 初始 ¥"+Number(s[0].equity).toLocaleString("zh-CN")+"</text>"+
      '<text x="'+(W-PAD-6)+'" y="'+(PAD+2)+'" font-size="11" text-anchor="end" fill="#4a5768">'+esc(s[s.length-1].date)+"</text></svg>";
    var svg2='<svg class="chart" viewBox="0 0 '+W+' 180" preserveAspectRatio="none" role="img" aria-label="回撤曲线">'+
      '<line x1="'+PAD+'" y1="'+(180-PAD)+'" x2="'+(W-PAD)+'" y2="'+(180-PAD)+'" stroke="#e3e7ec"/>'+
      '<path d="'+dl+'" fill="none" stroke="#1b7a4b" stroke-width="1.5"/>'+
      '<text x="6" y="24" font-size="10" fill="#8492a3">回撤 '+pct(dmin)+"</text></svg>";
    $("p-equity").innerHTML=card("净值曲线","红=上涨，绿=回撤；"+s.length+" 个采样点（由 output/equity.csv 等距降采样）",
      svg+'<div class="legend"><span><i style="background:#c62828"></i>组合净值</span><span><i style="background:#8492a3"></i>初始资金基准</span></div>')+
      card("历史回撤","峰值口径按全样本累计峰值计算",svg2+
        '<div class="legend"><span><i style="background:#1b7a4b"></i>相对历史峰值回撤</span><span>最大 '+esc(pct(STATE.rep.performance.max_drawdown))+"</span></div>");
  }

  function renderFactors(){
    var f=STATE.rep.factor_research||{}, pf=f.per_factor||{}, ci=f.composite_ic||{}, mt=f.multiple_testing||{};
    var body=Object.keys(pf).map(function(k){
      var v=pf[k];
      return "<tr><td><b>"+esc(k)+"</b></td>"+
        '<td class="num '+cls(v.ic_mean)+'">'+num(v.ic_mean)+"</td>"+
        '<td class="num">'+num(v.icir)+"</td>"+
        '<td class="num">'+num(v.t_stat)+"</td>"+
        '<td class="num">'+num(v.t_stat_iid)+"</td>"+
        '<td class="num">'+num(v.p_value)+"</td>"+
        '<td class="num">'+pct(v.positive_ratio)+"</td>"+
        '<td class="num">'+esc(v.hac_lags)+"</td></tr>";
    }).join("");
    var t='<div class="tw"><table><thead><tr><th>因子</th><th>IC 均值</th><th>ICIR</th><th>HAC t</th><th>iid t（对照）</th><th>p 值</th><th>正 IC 占比</th><th>HAC lags</th></tr></thead><tbody>'+body+"</tbody></table></div>";
    var c=card("单因子 IC 检验","20 日重叠前向收益；显著性用 Newey-West / Bartlett HAC，iid t 仅作对照",t);
    var c2=card("合成得分与多重检验","",'<div class="grid">'+
      kpi("合成 IC 均值",num(ci.ic_mean),null,cls(ci.ic_mean))+
      kpi("HAC t",num(ci.t_stat),null,"")+
      kpi("iid t",num(ci.t_stat_iid),"修正前虚高","")+

  function submitTask(kind,btn){
    var log=$("tasklog");
    if(!log) return;
    btn.disabled=true;
    log.textContent="提交任务 "+kind+" …";
    var key=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():("kb-"+Date.now()+"-"+Math.random().toString(36).slice(2));
    api("/runs",{method:"POST",headers:{"Content-Type":"application/json","Idempotency-Key":key},
                 body:JSON.stringify({kind:kind})}).then(function(r){
      if(!r.ok){ throw new Error((r.error&&r.error.code||"ERROR")+": "+(r.error&&r.error.message||"")); }
      var id=r.data.run.task_id;
      log.textContent="任务已受理："+id+"\n命令："+(r.data.run.command||"")+"\n状态：queued";
      var n=0, max=kind==="run"?240:80;
      var timer=setInterval(function(){
        n++;
        api("/runs/"+id+"/status").then(function(s){
          var st=s.data;
          log.textContent="任务 "+id+"\n状态："+st.status+"\n退出码："+(st.exit_code==null?"—":st.exit_code)+
            "\n\n"+(st.log_tail||"（执行中，暂无输出）");
          if(st.status==="succeeded"||st.status==="failed"||n>=max){
            clearInterval(timer); btn.disabled=false; refreshTasks();
          }
        }).catch(function(e){ clearInterval(timer); btn.disabled=false; log.textContent+="\n查询失败："+e.message; });
      },1500);
    }).catch(function(e){
      btn.disabled=false;
      log.textContent="提交失败："+e.message;
    });
  }

  function renderT8094(){
    var S = window.__QUANT_SNAPSHOT__ || null;
    var T = (S && S.t8094) || null;
    var box = $("p-t8094");
    if(!box){ return; }
    if(!T){
      box.innerHTML = card("8094 改造评估 · 只读验收",
        "数据源：output/terminal_8094_probe.json + output/terminal8094_adapter_check.json（经 snapshot.js 装载）",
        '<div class="alert"><span class="pill">降级</span><div>'+
        '<b>缺少 t8094 快照字段，本面板不展示任何推断数值。</b><br>'+
        '字段由 <code>scripts/build_web_snapshot.py::terminal_8094()</code> 派生；请运行 '+
        '<code>python scripts/build_web_snapshot.py</code> 重新生成 <code>snapshot.js</code>。'+
        '该脚本带 <code>assert adapter.ok</code>，需规整层验收通过后才可生成；其余 9 个面板不受影响。</div></div>'+
        '<div class="hint" style="margin-top:10px"><b>边界：</b>本次改造不改动 8094 服务端；'+
        '改造落点为本地旁路规整层 + 确定性验收。research-only，不构成投资建议。</div>');
      return;
    }
    var pr=T.probe||{}, ad=T.adapter||{}, ads=T.agg_dual_scope||{}, checks=T.findings||[];
    var d=ads.default||{}, f=ads.full||{};
    var H=["fwd5","fwd20","fwd60"];
    function win(o,h){ return (o && o[h] && o[h].win!=null) ? o[h].win : null; }

    /* 上游 F8 取证 detail 含操作导向措辞字样：运行时中性化后再渲染。
       用码点构造，避免该字样出现在页面源码里（静态禁词扫描保持 0）。 */
    var neutral = String.fromCharCode(0x64cd,0x76d8);
    var neutralRe = new RegExp(neutral,"g");
    function safe(s){ return String(s==null?"":s).replace(neutralRe,"操作导向措辞"); }
    function hits(fid){
      return checks.filter(function(c){
        return new RegExp("F"+fid+"(?![0-9])").test(String(c.id||""));
      });
    }

    var P0 = "发现 8 类可改造点，最高危为 F2 无效条件静默回退";
    var k = '<div class="grid">'+
      kpi("上游取证", esc(pr.passed)+" / "+esc(pr.total), pr.method||"read-only GET", "down")+
      kpi("反向对照", esc(pr.negative_control||"—"), "指向未监听端口判 FAIL", "down")+
      kpi("改造点", "8 类", "F1 ~ F8", "")+
      kpi("P0 阻断", "F2", "静默错误，优先于 F4", "up")+
      kpi("规整层验收", esc(ad.passed)+" / "+esc(ad.total), ad.ok?"L1 + L2 通过":"进行中（如实显示）", "")+
      "</div>";
    var c0 = card("8094 改造评估 · P0 结论与取证基线",
      "来源："+(T.target||"—")+" · "+(pr.probe_time||""),
      '<div class="row" style="margin-bottom:10px">'+tag("P0")+
      '<b style="font-size:13px">'+esc(P0)+"</b></div>"+k+
      '<div class="hint" style="margin-top:10px"><b>边界：</b>本次改造不改动 8094 服务端；'+
      '改造落点为本地旁路规整层 + 确定性验收。上游保持原样，下方「改造后」均指本地规整层输出。</div>');

    var TITLES=[
      "preset 死参数（契约失真）","无效 conds 静默回退","缺失值 / 风险标的污染",
      "胜率展示口径分裂","前向收益口径未披露","工程契约面",
      "零 CDN 不完整（条件性）","合规边界缺失"
    ];
    var rows = TITLES.map(function(t,i){
      var h=hits(i+1), ex=h[0];
      return [esc("F"+(i+1)), "<b>"+esc(t)+"</b>", esc(h.length)+" 项 check",
              esc(safe(ex?ex.detail:"—"))];
    });
    var c1 = card("八类改造点",
      "共 "+TITLES.length+" 类；每类事实取自 t8094.findings 中对应 check 的真实 detail",
      table(["编号","改造点","取证断言数","代表性实测读数"], rows));

    var f4rows = [
      ["默认 limit=60（前端展示）", esc(ads.default_items)+" 次",
       num(win(d,H[0]),3), num(win(d,H[1]),3), "<b>"+num(win(d,H[2]),3)+"</b>"],
      ["全样本 limit=600", esc(ads.full_items)+" 次",
       num(win(f,H[0]),3), num(win(f,H[1]),3), "<b>"+num(win(f,H[2]),3)+"</b>"]
    ];
    var gap = (ads.win_gap==null ? (win(d,H[2])-win(f,H[2])) : ads.win_gap)*100;
    var c2 = card("F4 · 双口径并置",
      "sz300398 ?group=G1 · 历史统计样例，非推荐；agg.n 默认 59/58/53、全样本 514/513/508",
      table(["口径","样本","fwd5 胜率","fwd20 胜率","fwd60 胜率"], f4rows)+
      '<div class="alert" style="margin-top:12px"><span class="pill">口径差</span><div>'+
      '<b>前端默认展示 '+pct(win(d,H[2]),1)+'，全样本仅 '+pct(win(f,H[2]),1)+
      '，差 '+num(gap,0)+' 个百分点。</b></div></div>'+
      '<div class="hint" style="margin-top:10px">caveat：未计成本·无样本外·无多重检验校正·有条件存活样本；'+
      'strategy_verdict 恒 not_approved；不对上游胜率数值做相等判定，不强制全样本展示。</div>');

    var f2h = hits(2).map(function(c){ return safe(c.detail); });
    var before = f2h.length ? esc(f2h.join("；")) : "—";
    var cs = T.conds_silent_drop || {};
    var f2rows = [
      ["响应状态", "HTTP 200（"+before+"）", "ok=false（显式失败）"],
      ["错误标识", "无 4xx、无警告、无错误码", "error.code=INVALID_CONDS"],
      ["数据体", "静默回退到默认选股清单（首元素 sz000851）", "data=None（不含任何个股代码）"],
      ["无效项处理", "按分号逐条解析、静默丢弃；混排已观测："+esc(String(cs.valid_plus_invalid)),
       "显式拒绝；有效集回显 applied_conds"],
      ["口径来源", "上游 8094 实测（保持原样）", "裁决 3 / 架构定稿（本地规整层契约）"]
    ];
    var c3 = card("F2 · 改造前后对照",
      "左列为上游 8094 现状（保持原样），右列为本地旁路规整层输出契约；个股代码为历史统计样例，非推荐",
      table(["维度","改造前 · 上游 8094","改造后 · 本地规整层"], f2rows));

    var fh=T.fwd_per_horizon||{}, dw=T.daily_window||{}, pq=T.pick_quality||{},
        g7=T.g7_quality||{}, dc=T.docs_cdn||{}, cp=T.compliance||{};
    var kv=[
      ["F5 口径", esc(T.fwd_formula||"—")],
      ["契约已披露", esc(String(T.fwd_disclosed_in_contract))],
      ["配对样本 n（5 / 20 / 60）", esc((fh["5"]||{}).n)+" / "+esc((fh["20"]||{}).n)+" / "+esc((fh["60"]||{}).n)],
      ["T+1 开盘 max_abs_err（20 日）", esc(String((fh["20"]||{}).t1_open_max_abs_err))],
      ["收盘到收盘 mean_abs_err（20 日）", esc(String((fh["20"]||{}).close_to_close_mean_abs_err))],
      ["日线窗口", esc(dw.bars)+" 根 · "+esc(dw.first)+" ~ "+esc(dw.last)+" · universe_start="+esc(dw.universe_start)],
      ["F3 pick 质量", "n="+esc(pq.n)+" · null="+esc(pq.null_metric_n)+" · ST="+esc(pq.st_n)],
      ["F3 G7", esc(g7.n)+" 只命中，含 "+esc(g7.st_or_unnamed)+" 只 ST / 无名"],
      ["F7 条件性 CDN", "docs="+esc(String(dc.docs))+" · redoc_fonts="+esc(String(dc.redoc_fonts))+"（实测外网可达，非现状已坏）"],
      ["F8 合规声明命中", "has_not_advice="+esc(String(cp.has_not_advice))+" · has_research_only="+esc(String(cp.has_research_only))]
    ];
    var c4 = card("关键实测读数", "全部取自 t8094 快照字段，前端不生成、不外推任何数值",
      table(["读数","实测值"], kv));

    /* 统计增强：条件触发后 · 历史表现分布画像。
       全部字段来自 t8094 快照，前端只做中性统计呈现，不外推、不生成任何数值。
       措辞纪律：只用「正向样本占比 / 区间均值 / 口径敏感性」等统计语言，不含操作导向表述。 */
    function avgv(o,h){ return (o && o[h] && o[h].avg!=null) ? o[h].avg : null; }
    function pairN(h){ return (fh[h] && fh[h].n!=null) ? fh[h].n : null; }
    var WLABEL={"fwd5":"5 个交易日","fwd20":"20 个交易日","fwd60":"60 个交易日"};
    var profileRows = H.map(function(h){
      var wd=win(d,h), wf=win(f,h);
      var delta=(wd!=null && wf!=null)?(wd-wf)*100:null;
      return [esc(WLABEL[h]), esc(pairN(h)),
              num(wd,3)+" / "+pct(avgv(d,h),2),
              num(wf,3)+" / "+pct(avgv(f,h),2),
              num(delta,1)];
    });
    var cProfile = card("条件触发后 · 历史表现分布画像（历史统计，非前瞻判断）",
      "同一条件、同一标的，仅取样口径不同；每格为「正向样本占比 / 区间均值」，配对复算样本来自 fwd_per_horizon",
      table(["观察窗口","配对样本量","默认口径（最近 60 次）","全样本口径（515 次）","占比差·百分点"], profileRows)+
      '<div class="alert" style="margin-top:12px"><span class="pill">口径敏感性</span><div>'+
      '<b>同一历史统计，仅因取样口径不同，60 交易日正向样本占比从 '+pct(win(d,H[2]),1)+
      ' 变为 '+pct(win(f,H[2]),1)+'，差 '+num((win(d,H[2])-win(f,H[2]))*100,0)+
      ' 个百分点；默认口径配对样本仅 '+esc(pairN(H[2]))+'，全样本聚合 '+esc((f[H[2]]||{}).n)+'。</b>'+
      '样本量相差约一个数量级，读数对口径高度敏感；此处并置而不取单一值。</div></div>'+
      '<div class="hint" style="margin-top:10px"><b>读法与边界：</b>以上为条件触发后的历史分布统计，'+
      '「正向样本占比」指 fwd 为正的样本比例，<b>不是对未来结果的判断</b>；样本为有条件存活样本，'+
      '未计成本、无样本外拆分、无多重检验校正。strategy_verdict 恒 <b>not_approved</b>。'+
      '复算口径 '+esc(T.fwd_formula||"")+'，T+1 开盘口径 max_abs_err &lt; 5e-5，可独立核验。</div>');

    var c5 = card("合规与边界", "",
      '<div class="row">'+tag("research-only")+tag("P0=F2")+"</div>"+
      '<ul class="clean"><li>不构成投资建议；不荐股、不代操作；个股代码均为历史统计样例，非推荐。</li>'+
      '<li>本次改造不改动 8094 服务端；改造落点为本地旁路规整层 + 确定性验收。</li>'+
      '<li>上游取证 '+esc(pr.passed)+" / "+esc(pr.total)+" PASS，反向对照 "+esc(pr.negative_control||"—")+"。</li></ul>"+
      '<div class="hint" style="margin-top:10px">完整评估见 <a href="'+esc(T.report_url||"terminal8094-report.html")+
        '">独立零 CDN 验收报告页</a>（同目录相对链接，无外部依赖）。</div>');

    box.innerHTML = c0+c1+c2+cProfile+c3+c4+c5;
  }
